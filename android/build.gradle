buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "29.0.13113456"
        kotlinVersion = "1.9.22" // Updated to a valid Kotlin version
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.0") // Added AGP version
        classpath("com.facebook.react:react-native-gradle-plugin:0.74.2") // Added React Native Gradle Plugin version
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
        maven { url "$rootDir/../node_modules/react-native-camera/android/libs" }
        maven { url "https://jitpack.io" }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
    }
}
