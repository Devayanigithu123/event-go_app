buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
        maven {
            url("$rootDir/../node_modules/react-native/android") // Ensure RN local path is included
        }
        maven {
            url("https://www.jitpack.io") // Additional Maven repository
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2") // Keep Gradle plugin version aligned with Gradle wrapper
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin:0.71.19") // Explicit version for RN Gradle plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url("$rootDir/../node_modules/react-native/android") // React Native local repo
        }
        maven {
            url("https://www.jitpack.io")
        }
    }
}
